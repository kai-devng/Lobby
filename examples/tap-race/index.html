<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tap Race</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #e6eaf2; font: 16px "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px; }
    h1 { margin: 0 0 4px; }
    .hint { color: #8b96a8; margin-bottom: 24px; }
    .lane { margin: 14px 0; }
    .name { margin-bottom: 4px; }
    .track { height: 22px; background: #1f2633; border-radius: 11px; overflow: hidden; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, #5b6cf0, #4fd1a5); transition: width .08s linear; }
    .me .name { font-weight: 700; }
    #status { margin-top: 24px; font-size: 22px; font-weight: 700; color: #ffc857; min-height: 30px; }
  </style>
</head>
<body>
  <main>
    <h1>Tap Race</h1>
    <div class="hint">Mash <b>Space</b> to run. First to the end wins. <b>Esc</b> leaves.</div>
    <div id="lanes"></div>
    <div id="status"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
